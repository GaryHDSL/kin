<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a Core Webber client account"><title>Create Account | Core Webber</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><link rel="icon" type="image/png" href="assets/logo.png">
</head><body class="portal-page"><header class="site-header"><a class="brand" href="index.html"><img class="site-logo" src="assets/logo.png" alt="Pace 2 Find Properties logo"></a><a class="back-link" href="index.html">← Back to website</a></header><main class="auth-wrap"><section class="auth-card"><div class="section-label">CLIENT PORTAL</div><h1>Create your account.</h1><p>Register to manage your property and service enquiries.</p><form id="registerForm"><label>Full name<input name="full_name" autocomplete="name" required placeholder="Your full name"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required placeholder="+27 ..."></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="btn btn-accent" type="submit">Create account</button><div class="form-message" id="message" role="status"></div></form><div class="auth-links"><span>Already registered? <a href="client-login.html">Sign in</a></span></div></section><aside class="auth-aside"><span>CLIENT REGISTRATION</span><h2>Your projects.<br>Your progress.</h2><p>Create an account to keep your requests and project communication organised.</p></aside></main><script type="module" src="js/register.js"></script></body></html>
